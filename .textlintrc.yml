# Zenn の記事を日本語の技術文書向けプリセットで検査する。
rules:
  preset-ja-technical-writing: true
filters:
  # Zenn のメッセージやアコーディオン（:::message や :::details と閉じの :::）は
  # Markdown としては前後の行と同じ段落になるため、ja-no-mixed-period が ::: の行を
  # 文末とみなして「句点がない」と報告する。この誤検出だけを ::: の行で除外する。
  # 閉じの ::: は、直前の行が「。」か数式の「$$」で終わるときだけ除外する。
  # 「句点のない文」の直後に閉じの ::: があると、エラーは ::: の行で報告されるため、
  # 閉じの ::: をすべて除外すると句点の抜けを見逃す。
  allowlist:
    allow:
      # 開きの行（:::message、:::details タイトル など）
      - "/^:{3,}[^:\\s].*$/m"
      # 「。」や「$$」で終わる行の後の閉じの行（入れ子の閉じが続く場合も含む）
      - "/(?<=(?:。|\\$\\$)\\n(?::{3,}\\n)*):{3,}$/m"
