# Software Development のワークフロー。dg init が同梱のテンプレートから置いた

id: software-development
name: Software Development
labels:
  review: Review
transitions: []
reconcile:
  - when:
      - pr_merged
    status: done
  - when:
      - branch_merged
    status: done
  - when:
      - pr_open
      - "!pr_draft"
    status: review
  - when:
      - branch_exists
    status: in_progress
fields:
  - id: estimate
    type: number
    label: Estimate
steps:
  - id: investigate
    label: Investigate
  - id: implement
    label: Implement
    actions:
      - create_worktree
      - create_branch
      - run_tests
      - create_pr
    opens_on: claim
  - id: review
    label: Review
    actions:
      - run_tests
  - id: fix
    label: Fix
    actions:
      - run_tests
    opens_on: reclaim
  - id: merge
    label: Merge
    actions:
      - merge_pr
    approval: true
